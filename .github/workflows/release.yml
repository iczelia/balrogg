name: Release

on:
  push:
    tags:
      - '*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish'
        required: true

permissions:
  contents: write

env:
  #  Manual runs supply the version through the tag input.
  BLR_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
  UPX_VERSION: "5.0.2"

jobs:
  #  Package once for all release jobs.
  sources:
    name: Build sources
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install the archivers
        run: |
          sudo apt-get update
          sudo apt-get install -y bzip3 xz-utils zip
          bzip3 --version
          xz --version

      - name: Regenerate the ChangeLog from the git history
        run: |
          contrib/gitlog-to-changelog --format='%s%n%n%b%n' > ChangeLog.tmp
          mv ChangeLog.tmp ChangeLog
          head -20 ChangeLog

      - name: Bootstrap and configure
        run: ./bootstrap && ./configure

      - name: Build the source packages
        run: |
          pkg=$(sed -n 's/^PACKAGE_VERSION = //p' Makefile)
          test "$pkg" = "$BLR_VERSION" || \
            echo "::warning::tag $BLR_VERSION but configure.ac says $pkg"
          make VERSION="$BLR_VERSION" dist
          make VERSION="$BLR_VERSION" dist-zip
          gzip -dk "balrogg-$BLR_VERSION.tar.gz"
          bzip3 -k "balrogg-$BLR_VERSION.tar"
          ls -l "balrogg-$BLR_VERSION".*

      - name: Upload the source package artifact
        uses: actions/upload-artifact@v7
        with:
          name: balrogg-${{ env.BLR_VERSION }}
          if-no-files-found: error
          path: |
            balrogg-${{ env.BLR_VERSION }}.tar
            balrogg-${{ env.BLR_VERSION }}.tar.bz3
            balrogg-${{ env.BLR_VERSION }}.tar.gz
            balrogg-${{ env.BLR_VERSION }}.tar.xz
            balrogg-${{ env.BLR_VERSION }}.zip

  #  Statically linked Windows binaries.
  windows:
    name: Build Windows ${{ matrix.target.name }}
    needs: [ sources ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: x86_64
            host: x86_64-w64-mingw32
            packages: gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
            extra: ""
          - name: i686
            host: i686-w64-mingw32
            packages: gcc-mingw-w64-i686 binutils-mingw-w64-i686
            extra: ""
          - name: i686-win95
            host: i686-w64-mingw32
            packages: gcc-mingw-w64-i686 binutils-mingw-w64-i686
            extra: "--with-windows-target=win95"
    steps:
      - name: Download the source package artifact
        uses: actions/download-artifact@v7
        with:
          name: balrogg-${{ env.BLR_VERSION }}

      - name: Install the cross-toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.target.packages }}

      - name: Install UPX
        run: |
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64) arch=arm64 ;;
          esac
          dir="upx-$UPX_VERSION-${arch}_linux"
          curl -fL "https://github.com/upx/upx/releases/download/v$UPX_VERSION/$dir.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$dir" >> "$GITHUB_PATH"
          upx --version | head -1

      - name: Extract the source package
        run: |
          tar --strip-components=1 -mxf "balrogg-$BLR_VERSION.tar.gz"
          sleep 1
          touch aclocal.m4 configure config.h.in Makefile.in

      - name: Configure
        run: |
          ./configure --host=${{ matrix.target.host }} \
                      CC=${{ matrix.target.host }}-gcc \
                      ${{ matrix.target.extra }} \
                      --bindir=/ --program-suffix=-${{ matrix.target.name }} \
                      CFLAGS="-O2 -g" LDFLAGS=-static

      - name: Make
        run: make -j4 all

      - name: Check the Win95 image
        if: ${{ matrix.target.name == 'i686-win95' }}
        run: |
          file balrogg.exe
          make win95-check

      - name: Stage the binary
        run: |
          make DESTDIR="$PWD/output" install-exec
          binary=output/balrogg-${{ matrix.target.name }}.exe
          debug=output/balrogg-${{ matrix.target.name }}.dbg
          objcopy=${{ matrix.target.host }}-objcopy
          strip=${{ matrix.target.host }}-strip
          "$objcopy" --only-keep-debug "$binary" "$debug"
          "$strip" --strip-all "$binary"
          ( cd output && "$objcopy" \
              --add-gnu-debuglink=balrogg-${{ matrix.target.name }}.dbg \
              balrogg-${{ matrix.target.name }}.exe )
          if test '${{ matrix.target.name }}' = i686-win95; then
            OBJDUMP=${{ matrix.target.host }}-objdump \
            NM=${{ matrix.target.host }}-nm \
              /bin/bash contrib/check-win95-pe.sh \
              "$binary" config.h "$debug"
          fi
          cp config.h output/config.h
          ls -l output

      - name: Pack the binary with UPX
        run: |
          upx --brute -o output/balrogg-${{ matrix.target.name }}-upx.exe output/balrogg-${{ matrix.target.name }}.exe
          upx -t output/balrogg-${{ matrix.target.name }}-upx.exe

      - name: Upload the Windows build
        uses: actions/upload-artifact@v7
        with:
          name: balrogg-release-win-${{ matrix.target.name }}-${{ env.BLR_VERSION }}
          if-no-files-found: error
          path: output

  #  Run the complete suite against each exact Windows release image.
  windows-test:
    name: Test Windows ${{ matrix.target.name }}
    needs: [ sources, windows ]
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: x86_64
            msystem: UCRT64
            host: x86_64-w64-mingw32
            toolchain: mingw-w64-ucrt-x86_64-gcc
          - name: i686
            msystem: MINGW32
            host: i686-w64-mingw32
            toolchain: mingw-w64-i686-gcc
          - name: i686-win95
            msystem: MINGW32
            host: i686-w64-mingw32
            toolchain: mingw-w64-i686-gcc
    steps:
      - name: Download the source package artifact
        uses: actions/download-artifact@v7
        with:
          name: balrogg-${{ env.BLR_VERSION }}

      - name: Download the Windows build
        uses: actions/download-artifact@v7
        with:
          name: balrogg-release-win-${{ matrix.target.name }}-${{ env.BLR_VERSION }}
          path: target

      - uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: ${{ matrix.target.msystem }}
          install: >-
            make tar gzip diffutils coreutils grep sed gawk
            ${{ matrix.target.toolchain }}

      - name: Extract the source package
        run: |
          tar --strip-components=1 -mxf "balrogg-$BLR_VERSION.tar.gz"
          sleep 1
          touch aclocal.m4 configure config.h.in Makefile.in

      - name: Build the test harness
        run: |
          ./configure --build="`sh ./config.guess`" \
                      --host=${{ matrix.target.host }} \
                      CC=${{ matrix.target.host }}-gcc LDFLAGS=-static
          make -j4 test-programs

      - name: Full test suite
        run: |
          binary=`cd target && pwd`/balrogg-${{ matrix.target.name }}.exe
          chmod +x "$binary"
          VERBOSE=1 make -j4 check BLR_TEST_BINARY="$binary"

      - name: Show the test logs
        if: failure()
        run: cat test-suite.log tests/*.log 2>&1 || true

  #  Linux binaries built on the oldest supported image.
  linux:
    name: Build Linux ${{ matrix.target.name }}
    needs: [ sources ]
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: x86_64
            runner: ubuntu-22.04
          - name: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - name: Download the source package artifact
        uses: actions/download-artifact@v7
        with:
          name: balrogg-${{ env.BLR_VERSION }}

      - name: Extract the source package
        run: |
          tar --strip-components=1 -mxf "balrogg-$BLR_VERSION.tar.gz"
          sleep 1
          touch aclocal.m4 configure config.h.in Makefile.in

      - name: Install UPX
        run: |
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64) arch=arm64 ;;
          esac
          dir="upx-$UPX_VERSION-${arch}_linux"
          curl -fL "https://github.com/upx/upx/releases/download/v$UPX_VERSION/$dir.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$dir" >> "$GITHUB_PATH"
          upx --version | head -1

      - name: Configure
        run: |
          ./configure --bindir=/ --program-suffix=-linux-${{ matrix.target.name }} \
                      CFLAGS="-O2 -g" LDFLAGS=-static

      - name: Make
        run: make -j4 all

      - name: Full test suite
        run: VERBOSE=1 make -j4 check

      - name: Show the test logs
        if: failure()
        run: cat test-suite.log tests/*.log 2>&1 || true

      - name: Stage the binary
        run: |
          make DESTDIR="$PWD/output" install-exec
          binary=output/balrogg-linux-${{ matrix.target.name }}
          debug=output/balrogg-linux-${{ matrix.target.name }}.dbg
          file "$binary"
          if readelf -l "$binary" | grep -q 'Requesting program interpreter'; then
            echo "release binary has an ELF interpreter" >&2
            exit 1
          fi
          if readelf -d "$binary" 2>/dev/null | grep -q '(NEEDED)'; then
            echo "release binary has dynamic dependencies" >&2
            exit 1
          fi
          objcopy --only-keep-debug "$binary" "$debug"
          strip --strip-all "$binary"
          ( cd output && objcopy \
              --add-gnu-debuglink=balrogg-linux-${{ matrix.target.name }}.dbg \
              balrogg-linux-${{ matrix.target.name }} )
          ls -l output

      - name: Pack the binary with UPX
        run: |
          upx --brute -o output/balrogg-linux-${{ matrix.target.name }}-upx output/balrogg-linux-${{ matrix.target.name }}
          upx -t output/balrogg-linux-${{ matrix.target.name }}-upx
          output/balrogg-linux-${{ matrix.target.name }}-upx --version

      - name: Upload the Linux build
        uses: actions/upload-artifact@v7
        with:
          name: balrogg-release-linux-${{ matrix.target.name }}-${{ env.BLR_VERSION }}
          if-no-files-found: error
          path: output

  #  Statically linked Linux binaries for foreign architectures.
  linux-cross:
    name: Build Linux ${{ matrix.target.arch }}
    needs: [ sources ]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: ppc64le
            host: powerpc64le-linux-gnu
            qemu: ppc64le
            libc: ppc64el
            upx: true
          - arch: riscv64
            host: riscv64-linux-gnu
            qemu: riscv64
            libc: riscv64
          - arch: s390x
            host: s390x-linux-gnu
            qemu: s390x
            libc: s390x
          - arch: armhf
            host: arm-linux-gnueabihf
            qemu: arm
            libc: armhf
            upx: true
    env:
      QEMU: qemu-${{ matrix.target.qemu }}-static
    steps:
      - name: Download the source package artifact
        uses: actions/download-artifact@v7
        with:
          name: balrogg-${{ env.BLR_VERSION }}

      - name: Install the cross-toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static \
            gcc-${{ matrix.target.host }} \
            libc6-dev-${{ matrix.target.libc }}-cross

      - name: Install UPX
        if: matrix.target.upx
        run: |
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64) arch=arm64 ;;
          esac
          dir="upx-$UPX_VERSION-${arch}_linux"
          curl -fL "https://github.com/upx/upx/releases/download/v$UPX_VERSION/$dir.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$dir" >> "$GITHUB_PATH"
          upx --version | head -1

      - name: Extract the source package
        run: |
          tar --strip-components=1 -mxf "balrogg-$BLR_VERSION.tar.gz"
          sleep 1
          touch aclocal.m4 configure config.h.in Makefile.in

      - name: Configure
        run: |
          ./configure --host=${{ matrix.target.host }} \
                      CC=${{ matrix.target.host }}-gcc \
                      --bindir=/ \
                      --program-suffix=-linux-${{ matrix.target.arch }} \
                      CFLAGS="-O2 -g" LDFLAGS=-static

      - name: Make
        run: make -j4 all

      - name: Write the launcher
        run: |
          mkdir qw
          printf '#!/bin/sh\nexec %s "%s" "$@"\n' \
            "$QEMU" "$PWD/balrogg" > qw/balrogg
          chmod +x qw/balrogg
          ./qw/balrogg --version

      - name: Full test suite under QEMU
        run: |
          VERBOSE=1 make -j4 check LOG_COMPILER="$QEMU" \
            BLR_TEST_BINARY="$PWD/qw/balrogg"

      - name: Show the test logs
        if: failure()
        run: cat test-suite.log tests/*.log 2>&1 || true

      - name: Stage the binary
        run: |
          make DESTDIR="$PWD/output" install-exec
          binary=output/balrogg-linux-${{ matrix.target.arch }}
          debug=$binary.dbg
          tools=${{ matrix.target.host }}
          file "$binary"
          if "$tools-readelf" -l "$binary" \
               | grep -q 'Requesting program interpreter'; then
            echo "release binary has an ELF interpreter" >&2
            exit 1
          fi
          if "$tools-readelf" -d "$binary" 2>/dev/null | grep -q '(NEEDED)'; then
            echo "release binary has dynamic dependencies" >&2
            exit 1
          fi
          "$tools-objcopy" --only-keep-debug "$binary" "$debug"
          "$tools-strip" --strip-all "$binary"
          ( cd output && "$tools-objcopy" \
              --add-gnu-debuglink=balrogg-linux-${{ matrix.target.arch }}.dbg \
              balrogg-linux-${{ matrix.target.arch }} )
          ls -l output

      - name: Pack the binary with UPX
        if: matrix.target.upx
        run: |
          upx --brute -o output/balrogg-linux-${{ matrix.target.arch }}-upx output/balrogg-linux-${{ matrix.target.arch }}
          upx -t output/balrogg-linux-${{ matrix.target.arch }}-upx
          $QEMU output/balrogg-linux-${{ matrix.target.arch }}-upx --version

      - name: Upload the cross-built Linux build
        uses: actions/upload-artifact@v7
        with:
          name: balrogg-release-linux-${{ matrix.target.arch }}-${{ env.BLR_VERSION }}
          if-no-files-found: error
          path: output

  #  Unsigned macOS binaries.
  macos:
    name: Build macOS ${{ matrix.target.name }}
    needs: [ sources ]
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: arm64
            runner: macos-latest
          - name: x86_64
            runner: macos-26-intel
    steps:
      - name: Download the source package artifact
        uses: actions/download-artifact@v7
        with:
          name: balrogg-${{ env.BLR_VERSION }}

      - name: Extract the source package
        run: |
          tar --strip-components=1 -mxf "balrogg-$BLR_VERSION.tar.gz"
          sleep 1
          touch aclocal.m4 configure config.h.in Makefile.in

      - name: Configure
        run: |
          #  Apple does not provide a static libSystem.
          ./configure --bindir=/ --program-suffix=-macos-${{ matrix.target.name }} \
                      CC=clang CFLAGS="-O2 -g"

      - name: Make
        run: make -j4 all

      - name: Full test suite
        run: VERBOSE=1 make -j4 check

      - name: Show the test logs
        if: failure()
        run: cat test-suite.log tests/*.log 2>&1 || true

      - name: Stage the binary
        run: |
          make DESTDIR="$PWD/output" install-exec
          binary=output/balrogg-macos-${{ matrix.target.name }}
          dsymutil "$binary" -o "$binary.dSYM"
          strip -S -x "$binary"
          ls -l output

      - name: Upload the macOS build
        uses: actions/upload-artifact@v7
        with:
          name: balrogg-release-macos-${{ matrix.target.name }}-${{ env.BLR_VERSION }}
          if-no-files-found: error
          path: output

  #  MS-DOS binary, tested in a FreeDOS guest.
  dos:
    name: Build MS-DOS i386
    needs: [ sources ]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DJGPP_RELEASE: "v3.4"
      DJGPP_GCC: "1220"
      FREEDOS_VERSION: "1.4"
    steps:
      - name: Download the source package artifact
        uses: actions/download-artifact@v7
        with:
          name: balrogg-${{ env.BLR_VERSION }}

      - name: Extract the source package
        run: |
          tar --strip-components=1 -mxf "balrogg-$BLR_VERSION.tar.gz"
          sleep 1
          touch aclocal.m4 configure config.h.in Makefile.in

      - name: Cache the FreeDOS guest
        uses: actions/cache@v5
        with:
          path: ~/.cache/balrogg-freedos
          key: freedos-${{ runner.os }}-${{ runner.arch }}-${{ env.FREEDOS_VERSION }}-${{ hashFiles('contrib/dos/install-freedos.sh') }}

      - name: Install the DJGPP cross-toolchain and FreeDOS guest
        run: |
          #  Required by the prebuilt ar and ranlib.
          sudo apt-get update
          sudo apt-get install -y libfl2 mtools qemu-system-x86 unzip
          guest="$HOME/.cache/balrogg-freedos/$FREEDOS_VERSION"
          contrib/dos/install-freedos.sh "$guest"
          echo "FREEDOS_ROOT=$guest/share/balrogg-dos" >> "$GITHUB_ENV"
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
          curl -fL -o /tmp/djgpp.tar.bz2 \
            "https://github.com/andrewwutw/build-djgpp/releases/download/${DJGPP_RELEASE}/djgpp-linux64-gcc${DJGPP_GCC}.tar.bz2"
          tar -xjf /tmp/djgpp.tar.bz2 -C "$HOME"
          echo "$HOME/djgpp/bin" >> "$GITHUB_PATH"

      - name: Install UPX
        run: |
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64) arch=arm64 ;;
          esac
          dir="upx-$UPX_VERSION-${arch}_linux"
          curl -fL "https://github.com/upx/upx/releases/download/v$UPX_VERSION/$dir.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$dir" >> "$GITHUB_PATH"
          upx --version | head -1

      - name: Build for MS-DOS
        run: |
          mkdir build-dos
          ( cd build-dos && ../configure --host=i586-pc-msdosdjgpp \
                  --bindir=/ --program-suffix=-dos \
                  CC=i586-pc-msdosdjgpp-gcc CFLAGS="-O2 -g" \
              && make -j4 all \
              && make -j4 test-programs )

      #  objdump provides a stable BFD target name.
      - name: Verify the DOS binary format
        run: |
          file build-dos/balrogg.exe
          i586-pc-msdosdjgpp-objdump -f build-dos/balrogg.exe
          i586-pc-msdosdjgpp-objdump -f build-dos/balrogg.exe \
            | grep -q 'coff-go32-exe'

      - name: Full C suite in FreeDOS
        run: |
          sh contrib/dos/run-suite.sh build-dos "$FREEDOS_ROOT" \
             "$RUNNER_TEMP/dos-suite"

      - name: Show the test logs
        if: failure()
        run: cat "$RUNNER_TEMP"/dos-suite/*.log 2>&1 || true

      - name: Stage the binary
        run: |
          make -C build-dos DESTDIR="$PWD/output" install-exec
          i586-pc-msdosdjgpp-objcopy --only-keep-debug \
            output/balrogg-dos.exe output/balrogg-dos.dbg
          i586-pc-msdosdjgpp-strip --strip-all output/balrogg-dos.exe
          ( cd output && i586-pc-msdosdjgpp-objcopy \
              --add-gnu-debuglink=balrogg-dos.dbg balrogg-dos.exe )
          ls -l output

      - name: Pack the binary with UPX
        run: |
          upx --brute -o output/balrogg-dos-upx.exe output/balrogg-dos.exe
          upx -t output/balrogg-dos-upx.exe

      - name: Upload the DOS build
        uses: actions/upload-artifact@v7
        with:
          name: balrogg-release-dos-i386-${{ env.BLR_VERSION }}
          if-no-files-found: error
          path: output

  #  Publish once, after every binary has been built and tested.
  publish:
    name: Publish the release
    needs: [ sources, windows-test, linux, linux-cross, macos, dos ]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Install the zip archiver
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Assemble the release
        run: |
          mkdir release debug

          cp "artifacts/balrogg-$BLR_VERSION/balrogg-$BLR_VERSION".* release/

          cp "artifacts/balrogg-release-win-x86_64-$BLR_VERSION/balrogg-x86_64.exe" release/
          cp "artifacts/balrogg-release-win-i686-$BLR_VERSION/balrogg-i686.exe" release/
          cp "artifacts/balrogg-release-win-i686-win95-$BLR_VERSION/balrogg-i686-win95.exe" release/
          cp "artifacts/balrogg-release-linux-x86_64-$BLR_VERSION/balrogg-linux-x86_64" release/
          cp "artifacts/balrogg-release-linux-aarch64-$BLR_VERSION/balrogg-linux-aarch64" release/
          cp "artifacts/balrogg-release-linux-ppc64le-$BLR_VERSION/balrogg-linux-ppc64le" release/
          cp "artifacts/balrogg-release-linux-riscv64-$BLR_VERSION/balrogg-linux-riscv64" release/
          cp "artifacts/balrogg-release-linux-s390x-$BLR_VERSION/balrogg-linux-s390x" release/
          cp "artifacts/balrogg-release-linux-armhf-$BLR_VERSION/balrogg-linux-armhf" release/
          cp "artifacts/balrogg-release-macos-arm64-$BLR_VERSION/balrogg-macos-arm64" release/
          cp "artifacts/balrogg-release-macos-x86_64-$BLR_VERSION/balrogg-macos-x86_64" release/
          cp "artifacts/balrogg-release-dos-i386-$BLR_VERSION/balrogg-dos.exe" release/

          cp "artifacts/balrogg-release-win-x86_64-$BLR_VERSION/balrogg-x86_64-upx.exe" release/
          cp "artifacts/balrogg-release-win-i686-$BLR_VERSION/balrogg-i686-upx.exe" release/
          cp "artifacts/balrogg-release-win-i686-win95-$BLR_VERSION/balrogg-i686-win95-upx.exe" release/
          cp "artifacts/balrogg-release-linux-x86_64-$BLR_VERSION/balrogg-linux-x86_64-upx" release/
          cp "artifacts/balrogg-release-linux-aarch64-$BLR_VERSION/balrogg-linux-aarch64-upx" release/
          cp "artifacts/balrogg-release-linux-ppc64le-$BLR_VERSION/balrogg-linux-ppc64le-upx" release/
          cp "artifacts/balrogg-release-linux-armhf-$BLR_VERSION/balrogg-linux-armhf-upx" release/
          cp "artifacts/balrogg-release-dos-i386-$BLR_VERSION/balrogg-dos-upx.exe" release/

          cp artifacts/balrogg-release-win-*-"$BLR_VERSION"/*.dbg debug/
          cp artifacts/balrogg-release-linux-*-"$BLR_VERSION"/*.dbg debug/
          cp artifacts/balrogg-release-dos-i386-"$BLR_VERSION"/*.dbg debug/
          cp -R artifacts/balrogg-release-macos-*-"$BLR_VERSION"/*.dSYM debug/

          test "$(find debug -name '*.dbg' -type f | wc -l)" -eq 10
          test "$(find debug -name '*.dSYM' -type d | wc -l)" -eq 2
          ( cd debug && zip -9 -r \
              "../release/balrogg-$BLR_VERSION-debug-symbols.zip" . )

          #  5 source packages, 12 binaries, 8 UPX-packed binaries, and
          #  the debug bundle.
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 26
          ls -l release

      - name: Upload the complete release artifact
        uses: actions/upload-artifact@v7
        with:
          name: balrogg-release-${{ env.BLR_VERSION }}
          if-no-files-found: error
          path: release

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.BLR_VERSION }}
          overwrite_files: true
          files: release/*

      #  Debug symbols ship only inside the bundle; drop any loose copies
      #  left on the release by an earlier run.
      - name: Remove separately published debug symbols
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=$(gh release view "$BLR_VERSION" --json assets \
            --jq '.assets[].name')
          for asset in \
            balrogg-x86_64.dbg balrogg-i686.dbg balrogg-i686-win95.dbg \
            balrogg-linux-x86_64.dbg balrogg-linux-aarch64.dbg \
            balrogg-linux-ppc64le.dbg balrogg-linux-riscv64.dbg \
            balrogg-linux-s390x.dbg balrogg-linux-armhf.dbg balrogg-dos.dbg \
            balrogg-macos-arm64.dSYM.zip balrogg-macos-x86_64.dSYM.zip
          do
            printf '%s\n' "$assets" | grep -Fxq "$asset" || continue
            gh release delete-asset "$BLR_VERSION" "$asset" --yes
          done
